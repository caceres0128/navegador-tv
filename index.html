<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Inicio · Navegador Alejandro</title>
<style>
  :root { --a: #7cc4ff; --card: rgba(255,255,255,.06); --borde: rgba(255,255,255,.12); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; color: #fff; font-family: Arial, Helvetica, sans-serif;
    background: radial-gradient(circle at 25% 15%, #1d3b5c, #0a1220 65%) fixed; }
  main { width: 1680px; margin: 0 auto; padding: 50px 0 80px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 34px; }
  .hora { font-size: 26px; opacity: .7; }
  h1 { font-size: 72px; margin: 6px 0 0; }
  h1 span { color: var(--a); }
  .datos { display: flex; gap: 22px; }
  .dato { background: var(--card); border: 1px solid var(--borde); border-radius: 22px; padding: 18px 26px; min-width: 300px; }
  .dato small { display: block; font-size: 17px; letter-spacing: .14em; text-transform: uppercase; opacity: .6; }
  .dato b { display: block; font-size: 42px; margin: 6px 0 2px; }
  .dato em { font-style: normal; font-size: 19px; opacity: .8; }
  form { margin-bottom: 34px; }
  input { width: 100%; font-size: 32px; padding: 22px 30px; border-radius: 20px; border: 3px solid #2a3c55;
    background: #0f1a2b; color: #fff; outline: none; }
  input:focus { border-color: var(--a); }
  h2 { font-size: 24px; letter-spacing: .12em; text-transform: uppercase; opacity: .65; margin: 0 0 16px;
    display: flex; justify-content: space-between; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 20px; margin-bottom: 40px; }
  .fav { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    height: 170px; background: var(--card); border: 3px solid var(--borde); border-radius: 22px; color: #fff;
    text-decoration: none; font-size: 24px; padding: 10px; text-align: center; }
  .fav:focus, .fav:hover { border-color: var(--a); box-shadow: 0 0 24px var(--a); outline: none; }
  .fav i { width: 70px; height: 70px; border-radius: 50%; background: var(--a); color: #0a1220; font-style: normal;
    font-size: 36px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .fav span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quitar { position: absolute; top: 8px; right: 8px; width: 46px; height: 46px; border-radius: 50%; border: 0;
    background: #e5484d; color: #fff; font-size: 24px; display: none; cursor: pointer; }
  .editando .quitar { display: block; }
  button.chico { font-size: 20px; color: #fff; background: var(--card); border: 2px solid var(--borde);
    border-radius: 14px; padding: 10px 18px; cursor: pointer; letter-spacing: 0; text-transform: none; }
  .hist { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 30px; }
  .hist a { display: block; color: #dfe9f7; text-decoration: none; font-size: 22px; padding: 14px 18px; border-radius: 14px;
    background: rgba(255,255,255,.035); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist a small { opacity: .5; margin-left: 10px; }
  .hist a:hover, .hist a:focus { outline: 3px solid var(--a); }
  .vacio { opacity: .5; font-size: 22px; }
  footer { margin-top: 44px; font-size: 18px; opacity: .45; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="hora" id="hora"></div>
      <h1><b id="saludo"></b>, <span>Alejandro</span></h1>
    </div>
    <div class="datos">
      <div class="dato"><small>Dólar hoy (TRM)</small><b id="trm">—</b><em id="trm2"></em></div>
      <div class="dato"><small>Clima en Tunja</small><b id="clima">—</b><em id="clima2"></em></div>
    </div>
  </header>

  <form id="f"><input id="q" placeholder="🔎  Buscar en Google o escribir una dirección" autocomplete="off"></form>

  <h2>Favoritos <button class="chico" id="editar" type="button">✏ Editar</button></h2>
  <div class="grid" id="favs"></div>

  <h2>Visitados recientemente <button class="chico" id="borrarHist" type="button">🗑 Borrar historial</button></h2>
  <div class="hist" id="hist"></div>

  <footer>Play/Pausa: menú · ⭐ en el menú agrega la página actual a favoritos · 🟡 vuelve aquí</footer>
</main>
<script>
(function () {
  var POR_DEFECTO = [
    { n: 'Google', u: 'https://www.google.com/' },
    { n: 'TikTok', u: 'https://www.tiktok.com/' },
    { n: 'Wikipedia', u: 'https://es.wikipedia.org/' },
    { n: 'Claude', u: 'https://claude.ai/' },
    { n: 'Gmail', u: 'https://mail.google.com/' },
    { n: 'Noticias', u: 'https://news.google.com/?hl=es-419&gl=CO&ceid=CO:es-419' }
  ];
  var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var CLIMA = {0:['Despejado','☀️'],1:['Mayormente despejado','🌤️'],2:['Parcialmente nublado','⛅'],3:['Nublado','☁️'],
    45:['Neblina','🌫️'],48:['Neblina','🌫️'],51:['Llovizna ligera','🌦️'],53:['Llovizna','🌦️'],55:['Llovizna fuerte','🌧️'],
    61:['Lluvia ligera','🌦️'],63:['Lluvia','🌧️'],65:['Lluvia fuerte','🌧️'],80:['Chubascos','🌦️'],81:['Chubascos','🌧️'],
    82:['Chubascos fuertes','⛈️'],95:['Tormenta','⛈️'],96:['Tormenta con granizo','⛈️'],99:['Tormenta fuerte','⛈️']};

  function $(id) { return document.getElementById(id); }
  function leer(k, def) { try { var v = JSON.parse(localStorage.getItem(k) || 'null'); return v || def; } catch (e) { return def; } }
  function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function pesos(n) { var p = n.toFixed(2).split('.'); return p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + p[1]; }

  function reloj() {
    var d = new Date(), h = d.getHours(), m = d.getMinutes(), ap = h < 12 ? 'AM' : 'PM', h12 = h % 12 || 12;
    $('hora').textContent = DIAS[d.getDay()].charAt(0).toUpperCase() + DIAS[d.getDay()].slice(1) + ' ' + d.getDate() +
      ' de ' + MESES[d.getMonth()] + ' · ' + (h12 < 10 ? '0' : '') + h12 + ':' + (m < 10 ? '0' : '') + m + ' ' + ap;
    $('saludo').textContent = h < 12 ? 'Buenos días' : (h < 19 ? 'Buenas tardes' : 'Buenas noches');
  }

  function favoritos() { var f = leer('navAleFavs', null); return f && f.length ? f : POR_DEFECTO; }
  function pintarFavs() {
    $('favs').innerHTML = favoritos().map(function (f, i) {
      return '<a class="fav" href="' + esc(f.u) + '"><i>' + esc((f.n || '?').charAt(0).toUpperCase()) + '</i><span>' +
        esc(f.n) + '</span><button class="quitar" data-i="' + i + '" type="button" title="Quitar">✕</button></a>';
    }).join('');
  }
  function pintarHist() {
    var h = leer('navAleHist', []).slice(0, 12);
    $('hist').innerHTML = h.length ? h.map(function (x) {
      var dom = ''; try { dom = new URL(x.u).hostname.replace(/^www\./, ''); } catch (e) {}
      return '<a href="' + esc(x.u) + '">' + esc(x.n || dom) + '<small>' + esc(dom) + '</small></a>';
    }).join('') : '<div class="vacio">Aquí aparecerán las páginas que visites.</div>';
  }

  $('favs').addEventListener('click', function (e) {
    var b = e.target.closest('.quitar');
    if (!b) return;
    e.preventDefault(); e.stopPropagation();
    var lista = favoritos().slice();
    lista.splice(+b.getAttribute('data-i'), 1);
    guardar('navAleFavs', lista.length ? lista : [{ n: 'Google', u: 'https://www.google.com/' }]);
    pintarFavs();
  });
  $('editar').addEventListener('click', function () {
    var ed = $('favs').classList.toggle('editando');
    this.textContent = ed ? '✔ Listo' : '✏ Editar';
  });
  $('borrarHist').addEventListener('click', function () { guardar('navAleHist', []); pintarHist(); });
  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var t = $('q').value.trim();
    if (!t) return;
    location.href = /^https?:\/\//i.test(t) ? t
      : (/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(t) ? 'https://' + t : 'https://www.google.com/search?q=' + encodeURIComponent(t));
  });

  function getJSON(url, ok) {
    var x = new XMLHttpRequest();
    x.open('GET', url); x.timeout = 10000;
    x.onload = function () { try { ok(JSON.parse(x.responseText)); } catch (e) {} };
    x.send();
  }
  getJSON('https://www.datos.gov.co/resource/32sa-8pi3.json?$limit=2&$order=vigenciadesde%20DESC', function (d) {
    var hoy = parseFloat(d[0].valor), ayer = d[1] ? parseFloat(d[1].valor) : hoy, c = hoy - ayer;
    $('trm').textContent = '$' + pesos(hoy);
    $('trm2').textContent = (c > 0 ? '▲ ' : c < 0 ? '▼ ' : '■ ') + '$' + pesos(Math.abs(c)) + ' vs. ayer';
    $('trm2').style.color = c > 0 ? '#ff8a80' : '#69f0ae';
  });
  getJSON('https://api.open-meteo.com/v1/forecast?latitude=5.5353&longitude=-73.3678&timezone=America%2FBogota' +
    '&forecast_days=1&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max', function (d) {
    var w = CLIMA[d.current.weather_code] || ['Variable', '🌡️'];
    $('clima').textContent = w[1] + ' ' + Math.round(d.current.temperature_2m) + '°C';
    $('clima2').textContent = w[0] + ' · ' + Math.round(d.daily.temperature_2m_max[0]) + '° / ' +
      Math.round(d.daily.temperature_2m_min[0]) + '° · Lluvia ' + d.daily.precipitation_probability_max[0] + '%';
  });

  // Si se agregan favoritos o historial desde otra pagina mientras esta abierta
  window.addEventListener('storage', function () { pintarFavs(); pintarHist(); });
  window.addEventListener('pageshow', function () { pintarFavs(); pintarHist(); });
  reloj(); setInterval(reloj, 10000);
  pintarFavs(); pintarHist();
})();
</script>
</body>
</html>
